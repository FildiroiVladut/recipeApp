<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <title>forkify // Search over 1,000,000 recipes</title>
</head>

<body>
    <div class="container">
        <header class="header">
            <img src="img/logo.svg" alt="forkify" class="header__logo">
            <form class="search">
                <input type="text" class="search__field" placeholder="Search recipes, e.g. pizza, pasta, avocado..." aria-label="Search recipes">
                <button class="btn search__btn">
                    <svg class="search__icon">
                        <use href="img/icons.svg#icon-magnifying-glass"></use>
                    </svg>
                    <span>Search</span>
                </button>
            </form>
            <div class="likes">
                <div class="likes__field">
                    <svg class="likes__icon">
                        <use href="img/icons.svg#icon-heart"></use>
                    </svg>
                </div>
                <div class="likes__panel">
                    <ul class="likes__list"></ul>
                </div>
            </div>
        </header>

        <div class="results">
            <ul class="results__list"></ul>
            <div class="results__pages"></div>
        </div>

        <div class="recipe">
            <div class="recipe__empty">
                <svg>
                    <use href="img/icons.svg#icon-smile"></use>
                </svg>
                <p>Start by searching for a recipe or an ingredient. Have fun!</p>
            </div>
        </div>

        <div class="shopping">
            <h2 class="heading-2">My Shopping List</h2>
            <ul class="shopping__list"></ul>

            <div class="copyright">
                &copy; Designed and built by <a href="https://github.com/FildiroiVladut" target="_blank" rel="noopener" class="link">Vladut Fildiroi</a>.
                Recipe data from the <a href="https://forkify-api.herokuapp.com" target="_blank" rel="noopener" class="link">Forkify API</a>.
            </div>
        </div>
    </div>
</body>

</html>
